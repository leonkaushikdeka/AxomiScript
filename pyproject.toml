[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axomiscript"
version = "1.0.0"
description = "Assamese (and multi-language) programming language — write, compile, and run"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["assamese", "programming-language", "transpiler", "compiler", "ide", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "lark>=1.3.0",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
dev = ["pytest>=7.0", "pytest-cov", "flask>=3.0", "ruff", "mypy"]

[project.scripts]
axomiscript = "axomiscript.cli:main"

[project.urls]
Homepage = "https://github.com/leonkaushikdeka/AxomiScript"
"Bug Tracker" = "https://github.com/leonkaushikdeka/AxomiScript/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["axomiscript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
